<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="拖拖看：把抽象概念变成能拖参数的可交互沙盒">
  <title>拖拖看 · 交互式概念沙盒</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">拖拖看</span>
        <span class="tagline">把抽象概念变成能拖的沙盒</span>
      </div>
      <div class="ask-area">
        <p id="askPrivacy" class="ask-privacy">图片和语音只在本机识别文件名，以及画面里能读到的文字。点「图片 / 语音」前请知悉：这些内容不会上传。</p>
        <div class="ask-row">
          <span class="ask-prefix">我不懂</span>
          <input id="conceptInput" type="text" autocomplete="off" placeholder="过拟合 / 供需 / 抛体 / R₀ …">
          <input id="mediaInput" type="file" accept="image/*,.svg,audio/*,text/plain" hidden>
          <button id="mediaBtn" type="button" class="btn tiny">图片 / 语音</button>
          <button id="askBtn" class="btn primary">生成沙盒</button>
        </div>
        <div id="askHint" class="ask-hint"></div>
      </div>
      <button id="journalBtn" class="btn ghost">
        学习记录 <span id="journalBadge" class="badge">0</span>
      </button>
    </header>

    <nav id="viewNav" class="view-nav" aria-label="视图切换">
      <button class="view-tab" data-view="graph">概念图谱</button>
      <button class="view-tab active" data-view="sandbox">交互沙盒</button>
      <button class="view-tab" data-view="report">学习报告</button>
      <button class="view-tab" data-view="studio">模板工坊</button>
    </nav>

    <main id="views">
      <section id="view-graph" class="view view-pane" hidden></section>

      <div id="view-sandbox" class="view layout">
        <aside class="sidebar">
          <div class="side-head">
            <span>概念库</span>
            <span id="tplCount" class="side-count"></span>
          </div>
          <div id="subjectNav" class="subject-nav"></div>
          <div id="tplList" class="tpl-list"></div>
          <div class="side-foot">
            <strong>通用引擎</strong>
            模板只描述「参数 + 模型 + 指标」，<br>渲染与运行时完全复用。<br>
            <span class="kbd">← →</span> 可快速切换概念
          </div>
        </aside>

        <section class="stage">
          <div class="stage-head">
            <div>
              <h1 id="tplName">—</h1>
              <p id="tplBrief"></p>
            </div>
            <span id="tplSubject" class="subject-tag"></span>
          </div>
          <div class="canvas-wrap">
            <canvas id="stage"></canvas>
            <!-- #I9 模拟控件：静态声明，由 app.js 绑定；只在带 tpl.sim 的概念下显示 -->
            <div id="simBar" class="sim-bar" hidden>
              <button id="simPlayBtn" type="button" class="sim-btn primary">播放模拟</button>
              <label class="sim-speed" for="simSpeed">速度
                <input id="simSpeed" type="range" min="0.25" max="8" step="0.25" value="1" aria-label="播放速度">
              </label>
              <button id="simResetBtn" type="button" class="sim-btn">重置</button>
              <span id="simLabel" class="sim-label">当前概念暂无动态模拟</span>
            </div>
          </div>
          <div class="insight-box">
            <span class="insight-icon">✦</span>
            <p id="insight"></p>
          </div>
          <div class="concept-box">
            <span class="box-label">概念说明</span>
            <p id="conceptNote"></p>
          </div>
        </section>

        <aside class="panel">
          <div class="panel-head">
            <span>参数 <em>拖动即时重算</em></span>
            <button id="resetBtn" class="btn tiny">重置</button>
          </div>
          <div id="paramList" class="param-list"></div>

          <div class="panel-head"><span>观测指标</span></div>
          <div id="metricList" class="metrics"></div>

          <div class="panel-head"><span>试试看 <em id="challengeCount"></em></span></div>
          <div id="challengeList" class="challenges"></div>

          <button id="stuckBtn" class="stuck-btn">
            <span>我卡住了，给我推一个前置概念</span><span class="arrow">→</span>
          </button>
          <div class="panel-foot">记录仅保存在本机浏览器，不上传</div>
        </aside>
      </div>

      <section id="view-report" class="view view-pane" hidden></section>
      <section id="view-studio" class="view view-pane" hidden></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <div id="mask" class="mask"></div>
  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <div>
        <h2>学习记录</h2>
        <p>你在沙盒里试过的每一步，都会变成下一步的依据</p>
      </div>
      <button id="closeDrawer" class="btn tiny">关闭</button>
    </div>
    <div id="statBox" class="stat-box"></div>
    <h3>概念掌握度</h3>
    <div id="progressBox" class="progress-box"></div>
    <h3>最近轨迹</h3>
    <div id="timeline" class="timeline"></div>
    <button id="clearLog" class="btn danger">清空本机记录</button>
  </aside>

  <!-- 传统 script 标签：双击 index.html 即可运行，file:// 下无 CORS 问题。
       顺序 = 依赖顺序，新增模块请按分层追加；各目录 owner 见 README / CODEOWNERS。
       四视图已由 #I1 接入；报告 / 工坊 / 图谱的精修分别见 #I2 / #I3 / #I14。 -->
  <script src="src/core/engine.js"></script>      <!-- 曹：状态与数学工具 -->
  <script src="src/core/expr.js"></script>        <!-- 曹：安全表达式求值 -->
  <script src="src/model/dsl.js"></script>        <!-- 姜：模板 DSL 编译 -->
  <script src="src/model/generator.js"></script>  <!-- 姜：概念输入 / AI 生成（未配置代理时降级为本地草稿） -->
  <script src="src/viz/render.js"></script>       <!-- 付：Canvas 渲染器 -->
  <script src="src/model/templates.js"></script>  <!-- 姜：精修概念模板库 -->
  <script src="src/learning/data.js"></script>   <!-- 秦：数据层适配器 -->
  <script src="src/learning/graph.js"></script>  <!-- 付+秦：概念图谱 / 诊断 -->
  <script src="src/ui/views.js"></script>        <!-- 付：四视图路由与最小可用视图 -->
  <script src="src/ui/app.js"></script>          <!-- 付：页面交互与装配 -->
</body>
</html>
