openapi: 3.0.3
info:
  title: 拖拖看 · 匿名同步服务 API
  version: 1.0.0
  description: >-
    秦负责实现。所有接口只接收匿名数据：不得记录姓名、学校、设备指纹、IP 到业务数据。
    学习事件的字段与 contracts/learning-trace.schema.json 完全一致；
    前端 TTK.data.remote 的 base URL 指向本服务的 servers[0].url。
    未配置服务时前端纯 localStorage 运行，行为必须保持一致。
servers:
  - url: https://api.example.invalid/v1
    description: 占位地址，部署后替换；本地开发可用 http://127.0.0.1:8787/v1
tags:
  - name: events
    description: 学习轨迹事件
  - name: trace
    description: 匿名导出与导入
  - name: templates
    description: 用户自定义模板
  - name: identity
    description: 匿名身份
  - name: generation
    description: 可选模型代理（模型密钥只放服务端）
paths:
  /generate:
    post:
      tags: [generation]
      summary: 调用 Chat Completions 兼容上游生成 TemplateSpec
      description: >-
        完整本地地址为 http://127.0.0.1:8787/v1/generate；无需 X-Anon-Id 或前端 Authorization。
        上游完整 URL、密钥、默认模型由服务端 TTK_LLM_* 环境变量配置，不从请求体接收。
        仅转发 concept 与 prompt 文本，不发送学习轨迹、匿名 ID 或图片/语音字节。
        返回值经过 TemplateSpec 形状校验；挂载前客户端仍必须走 dsl.validate/compile 和 expr 白名单。
        服务端不重试，由生成器重试一次后诚实降级。每个进程默认全局每分钟 20 次、同时 2 次；不按 IP 计数或记录请求内容。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [concept, prompt]
              properties:
                concept: { type: string, minLength: 1, maxLength: 200 }
                model: { type: string, maxLength: 128, description: 可省或为空，使用服务端默认模型；非空时覆盖默认模型 }
                prompt: { type: string, minLength: 1, maxLength: 24000 }
      responses:
        '200':
          description: 纯数据模板（不自动写入同步数据库）
          content:
            application/json:
              schema:
                type: object
                required: [spec]
                properties:
                  spec: { type: object, description: 'TemplateSpec v1，source 为 llm，字段见 contracts/template.schema.json' }
        '400': { description: 输入字段、长度或类型不合法 }
        '413': { description: 请求体超过 2 MiB }
        '429':
          description: 本机全局限流、并发限制或上游限流
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
              description: 建议稍后重试的秒数
        '502': { description: 上游连接失败、非成功状态、非法 JSON / 模板或响应超过 1 MiB；不透传上游错误内容或重定向 }
        '503': { description: 尚未配置上游地址或有效模型名 }
        '504': { description: 上游总请求超时，已中止连接；默认 6500 毫秒 }
  /health:
    get:
      summary: 服务存活探针
      responses:
        '200': { description: 服务正在运行 }
  /auth/anonymous:
    post:
      tags: [identity]
      summary: 创建或恢复一个匿名身份
      description: >-
        只生成随机不可识别 ID，不需要手机号/邮箱/学号。
        客户端把返回的 anonId 存在本地；换设备时由用户手动输入该 ID 完成同步（见 #I11）。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                existingId:
                  type: string
                  description: 已有匿名 ID，传入则恢复，不新建
      responses:
        '200':
          description: 匿名身份
          content:
            application/json:
              schema:
                type: object
                required: [anonId]
                properties:
                  anonId:
                    type: string
                    pattern: '^[0-9a-f]{16}$'
                    description: 16 位十六进制（64 bit）随机串，由客户端或服务端生成，不可反推个人
                    example: 'a7f3c9e2b1d04f6c'
                  createdAt: { type: string, format: date-time }
  /events:
    post:
      tags: [events]
      summary: 批量上报学习事件（离线队列联网后一次提交）
      description: >-
        请求体与 contracts/learning-trace.schema.json 的 event 定义一致；服务端需按 anonId 去重（at + tpl + reason）。
        progress / stuck 为可选扩展字段（v1 兼容）：带上则一并同步挑战进度与卡点，供 #I11 跨设备接续；
        不带时行为与 v1 原始契约完全一致。
      parameters:
        - in: header
          name: X-Anon-Id
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{16}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anonymous, events]
              properties:
                anonymous: { type: boolean, enum: [true], description: 固定为 true，声明本批数据为匿名数据 }
                events:
                  type: array
                  items: { $ref: '#/components/schemas/LearningEvent' }
                progress:
                  type: object
                  additionalProperties: { type: boolean }
                  description: 可选。键为 '<tplId>:<challengeIndex>'，与服务端已有进度合并
                stuck:
                  type: array
                  description: 可选。卡点记录，按 at + tpl 去重后合并
                  items:
                    type: object
                    required: [at, tpl]
                    properties:
                      at: { type: integer, format: int64 }
                      tpl: { type: string }
      responses:
        '202':
          description: 校验和持久化成功后确认接收
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer, description: 通过校验的条数 }
                  added: { type: integer, description: 去重后实际入库条数 }
                  duplicates: { type: integer }
        '400': { description: 事件格式不合法，返回逐条错误 }
        '401': { description: X-Anon-Id 缺失或格式非法 }
        '413': { description: 请求体超过 2 MiB }
        '500': { description: 持久化失败，客户端应保留队列稍后重试 }
  /trace:
    get:
      tags: [trace]
      summary: 导出该匿名身份的完整学习轨迹
      parameters:
        - in: header
          name: X-Anon-Id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: LearningTrace v1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningTrace' }
  /trace/import:
    post:
      tags: [trace]
      summary: 导入一份匿名学习轨迹（与 TTK.data.importAll 输入格式相同）
      description: >-
        增量合并：事件按 at + tpl + reason 去重，挑战完成值取逻辑 OR，卡点按 at + tpl 去重。
        自定义模板按 id 保存，同 id 以最后一次成功上传为准；不支持远端删除。
      parameters:
        - in: header
          name: X-Anon-Id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearningTrace' }
      responses:
        '200':
          description: 导入结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  events: { type: integer }
        '400': { description: 轨迹或自定义模板不符合仓库契约，返回 details 字段路径 }
        '401': { description: X-Anon-Id 缺失或格式非法 }
        '500': { description: 持久化失败，未确认保存 }
  /templates:
    get:
      tags: [templates]
      summary: 列出该身份保存的自定义 TemplateSpec
      parameters:
        - in: header
          name: X-Anon-Id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 模板列表
          content:
            application/json:
              schema:
                type: array
                items: { type: object, description: 'TemplateSpec v1，字段见 contracts/template.schema.json；服务端按该 schema 校验' }
    put:
      tags: [templates]
      summary: 保存 / 覆盖一个自定义模板（服务端需按 template.schema.json 校验）
      parameters:
        - in: header
          name: X-Anon-Id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: 'TemplateSpec v1，字段见 contracts/template.schema.json；服务端按该 schema 校验' }
      responses:
        '200': { description: 已保存 }
        '422': { description: 模板未通过校验，返回逐字段错误 }
components:
  schemas:
    LearningEvent:
      type: object
      required: [at, tpl, reason, params]
      properties:
        at: { type: integer, format: int64, description: Unix 毫秒时间戳 }
        tpl: { type: string }
        name: { type: string }
        reason:
          type: string
          enum: [param, select, reset, stuck, challenge, view]
        params:
          type: object
          additionalProperties: { type: number }
        insight: { type: string }
    LearningTrace:
      type: object
      required: [schema, exportedAt, events]
      properties:
        schema: { type: string, enum: ['ttk.learning-trace.v1'] }
        exportedAt: { type: string, format: date-time }
        notice: { type: string }
        summary: { type: object }
        events:
          type: array
          items: { $ref: '#/components/schemas/LearningEvent' }
        progress:
          type: object
          additionalProperties: { type: boolean }
        stuck:
          type: array
          items:
            type: object
            required: [at, tpl]
            properties:
              at: { type: integer, format: int64 }
              tpl: { type: string }
        customTemplates:
          type: array
          items: { type: object }
